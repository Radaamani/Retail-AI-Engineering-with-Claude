[project]
name = "omnicommerceops"
version = "1.0.0"
description = "Unified Retail, FMCG, and E-Commerce sandbox for enterprise AI training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnicommerceops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
